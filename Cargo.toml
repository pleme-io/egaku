[package]
name = "egaku"
version = "0.1.14"
edition = "2024"
rust-version = "1.89.0"
description = "Egaku (描く) — GPU widget toolkit: text inputs, lists, tabs, modals, focus, keybindings"
homepage = "https://github.com/pleme-io/egaku"
repository = "https://github.com/pleme-io/egaku"
documentation = "https://docs.rs/egaku"
readme = "README.md"
license = "MIT"
categories = ["gui"]
keywords = ["widgets", "gui", "gpu", "wgpu", "toolkit"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
# ★ For `Refined<f32, B>` — see `split.rs`. egaku's split ratios were clamped
# with bare `f32::clamp`, which propagates NaN and PANICS when min > max.
ishou-tokens = "0.1"
# shibori — the fleet fuzzy-scoring contract, extracted from praça. egaku
# carried its own GREEDY single-pass scorer under a doc comment claiming it
# "mirrors praça's contract"; it did not (greedy alignment, always-lowercase,
# no whitespace terms). Delegating makes the claim true.
shibori = "0.1"
# The fleet's chord vocabulary. `KeyCombo` canonicalises through it so two
# spellings of one chord are one HashMap key — see the type's docs for the
# three places the fleet independently hit the silent-miss this closes.
awase = "0.1"

serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
# zeroize — SecretInput's buffer zeroes on drop. The fleet already uses
# `Zeroizing<String>` for this in cofre; same crate, same discipline, so a
# secret in a widget is handled exactly like a secret in the secret store.
zeroize = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
